<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>My First Web Page</title>
        <style>
            @font-face {
                font-family: "Avatar Airbender";
                src: url("Avatar Airbender.ttf") format("truetype");
                font-display: sw;
            }
            @font-face {
                font-family: "spiderman";
                src: url("HOMOARAK.ttf") format("truetype");
                font-display: swap;
            }

            body {
                background-color: #000000;
                padding: 30px;
                font-family: "Avatar Airbender", sans-serif;
            }
            .container {
                align-items: center;
                display: flex;
                gap: auto;
                justify-content: center;
                margin: 0 auto;
                max-width: 900px;
                min-height: 60vh;
            }
            .image-section,
            .text-section {
                flex: 1;
            }
            .image-section {
                text-align: center;
            }
            .text-section {
                text-align: left;
            }
            h1 {
                font-size: 64px;
                color: #dbd1d1;
            }
            p {
                font-size: 24px;
                color: #dbd1d1;
            }
            img {
                border-radius: 100px;
                max-width: 200px;
                height: auto;
                border: 4px solid #dbd1d1;
            }
            @media (max-width: 600px) {
                .container {
                    flex-direction: column;
                    min-height: auto;
                    padding: 40px 0;
                }
                .text-section {
                    text-align: center;
                }
            }
        </style>
    </head>

    <body>
        <script src="modern.js"></script>
        <div class="container">
            <div class="image-section">
                <img src="https://avatars.githubusercontent.com/u/87207362?v=4" alt="Pterodactyl Logo" width="200">
            </div>
            <div class="text-section">
                <h1>Basic Website</h1>
                
            </div>
        </div>
        <p>Welcome to my basic website!</p>
        <p style="font-family: 'spiderman', sans-serif;">Press F12 to open Developer Tools and see the console.</p>
    </body>
</html>
